# 数据库配置
sql:
  # 关闭则使用本地 SQLite 存储
  enable: false
  host: localhost
  port: 3306
  user: root
  password: root
  database: fst

# 称号配置
title:
  # 称号文件存储路径，文件名固定为 title.yml，{0} 为插件数据目录
  path: '{0}/titledata'
  # 默认前缀，不显示可改为空字符串：''
  prefix: '&2[公民]&r'

# 称号商城
shop:
  enable: true
  # VAULT / PLAYER_POINTS / BOTH
  currency: VAULT

# 称号权限处理
permission:
  # LUCKPERMS / GROUP_MANAGER / NONE
  mode: LUCKPERMS
  # 授权前检查玩家是否已经拥有该权限，避免卸下称号时误删原有权限
  safe-check: true
  # 本插件实际授予权限的记录键
  record-key: fst_granted_permissions
  group-manager:
    give: 'manuaddp {player} {permission}'
    take: 'manudelp {player} {permission}'

# 聊天显示
chat:
  # 是否由本插件接管聊天格式（如果使用其他聊天插件显示称号，请关闭）
  show: true
  # 可使用 %fst_title% 等 PlaceholderAPI 变量
  format: '<%fst_title%{DISPLAY_NAME}> {MESSAGE}'
