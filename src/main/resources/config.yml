# 配置结构版本，请勿随意修改
config-version: 3

# 数据库配置
sql:
  # 关闭则使用本地 SQLite 存储
  enable: false
  host: localhost
  port: 3306
  user: root
  password: root
  database: fst

# 称号配置
title:
  # 称号文件存储路径，文件名固定为 title.yml，{0} 为插件数据目录
  path: '{0}/titledata'
  # 默认前缀，不显示可改为空字符串：''
  prefix: '&2[公民]&r'

# 称号商城
shop:
  enable: true
  # 默认货币类型，称号可通过 shop.currency 单独覆盖。VAULT / PLAYER_POINTS / BOTH / FREE
  currency: VAULT
  # 是否记录购买成功/失败日志到 purchase-logs.yml
  log-purchases: true
  # 商城点击称号时是否先打开确认购买界面
  confirm-purchase: true

# 称号预览
preview:
  enable: true
  # 预览持续时间，支持 10s、1m 等
  duration: 10s
  # 预览冷却时间
  cooldown: 5s

# 头顶图片称号显示，需要客户端资源包将 display.text 中的字符映射为图片
display:
  enable: true
  # 显示实体跟随玩家的刷新间隔，单位 tick
  update-interval: 2
  # 默认显示高度，基于玩家脚下位置向上偏移
  default-y-offset: 2.55
  # 默认缩放
  default-scale: 1.0
  # 默认是否显示文字阴影
  default-shadow: false
  # 默认是否隔墙可见
  default-see-through: false
  # 自动图片资源包配置：把 images 目录中的 png 自动映射为可显示在头顶的字体字符
  resource-pack:
    enable: true
    # 图片来源目录，相对于插件数据目录
    image-folder: images
    # 资源包输出目录，同时会生成 resourcepack.zip
    output-folder: resourcepack
    # 资源包命名空间
    namespace: freeswitchtitle
    # 资源包 pack_format，默认适配 Minecraft 1.20.4
    pack-format: 22
    # 自动分配字符的起始码位，使用私有区避免冲突
    start-codepoint: '0xE001'
    # 字体图片默认高度与基线
    default-height: 16
    default-ascent: 8

# 称号图鉴与收藏奖励
collection:
  # 收藏数量达到指定阈值后自动发放奖励称号，奖励只会领取一次
  rewards:
    # 示例：拥有 5 个称号时发放 collector 称号
    # 5:
    #   - collector

# 称号权限处理
permission:
  # LUCKPERMS / GROUP_MANAGER / NONE
  mode: LUCKPERMS
  # 授权前检查玩家是否已经拥有该权限，避免卸下称号时误删原有权限
  safe-check: true
  # 本插件实际授予权限的记录键
  record-key: fst_granted_permissions
  group-manager:
    give: 'manuaddp {player} {permission}'
    take: 'manudelp {player} {permission}'

# 聊天显示
chat:
  # 是否由本插件接管聊天格式（如果使用其他聊天插件显示称号，请关闭）
  show: true
  # 可使用 %fst_title% 等 PlaceholderAPI 变量
  format: '<%fst_title%{DISPLAY_NAME}> {MESSAGE}'
