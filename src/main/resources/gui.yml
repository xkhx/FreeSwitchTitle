# 称号列表 GUI

gui:
  # GUI 标题
  title:
    all-title: "全部称号"
    shop-title: "称号商城"
    my-title: "{0} 的称号列表"
    collection-title: "称号图鉴"
    category-title: "选择称号分类"

  # 列表布局
  map:
    - "#########"
    - "#@@@@@@@#"
    - "L#C#M###N"

  # 显示称号列表的位置
  slotBy: '@'

  # 边框
  border:
    type: BLACK_STAINED_GLASS_PANE
    slot: '#'
    name: "&8⬛"

  # 个人信息
  info:
    type: PLAYER_HEAD
    slot: 'M'
    name: "&r我的信息"
    lore:
      - "&r正在使用: %fst_title_show%"
      - "&r拥有称号: %fst_title_count% 个"
      - "&r收藏进度: %fst_title_collected%/%fst_title_total% (%fst_title_progress%)"

  # 分类筛选
  category:
    type: COMPASS
    slot: 'C'
    name: "&f分类筛选"
    lore:
      - "&7当前分类: &f{category}"
      - "&a点击切换分类"

  # 分类选择菜单
  category-menu:
    all:
      type: BOOK
      name: "&a全部分类"
      lore:
        - "&7查看全部称号"
    item:
      type: PAPER
      name: "&f{category}"
      lore:
        - "&7点击查看该分类"

  # 图鉴未解锁物品显示
  locked-collection:
    type: GRAY_DYE
    name: "&8???"
    lore:
      - "&7尚未解锁该称号"
      - "&7稀有度: {rarity_color}{rarity_name}"
      - "&7收藏进度: &f{collected}/{total} &7({progress})"

  # 购买确认界面
  confirm:
    title: "确认购买 {title}"
    rows: 3
    info:
      type: BOOK
      slot: 13
      name: "&f{title}"
      lore:
        - "&7价格: &f{price}"
        - "&7期限: &f{duration}"
        - "&7稀有度: {rarity_color}{rarity_name}"
    yes:
      type: LIME_STAINED_GLASS_PANE
      slot: 11
      name: "&a确认购买"
      lore:
        - "&7点击确认购买"
    no:
      type: RED_STAINED_GLASS_PANE
      slot: 15
      name: "&c取消"
      lore:
        - "&7点击取消购买"

  # 上一页
  previous:
    type: SPECTRAL_ARROW
    first-type: ARROW
    slot: 'L'
    name: "&f上一页"
    first-name: "&7上一页"

  # 下一页
  next:
    type: SPECTRAL_ARROW
    last-type: ARROW
    slot: 'N'
    name: "&f下一页"
    last-name: "&7下一页"

  # 称号物品追加 lore 模板
  # 可用变量: {title}, {uid}, {category}, {rarity}, {rarity_name}, {rarity_color}, {duration}, {expire}, {vault_price}, {points_price}, {collected}, {total}, {progress}
  lore:
    player-list:
      using:
        - '&a状态: 正在使用'
        - '&7剩余时间: &f{expire}'
      equip:
        - '&a点击佩戴'
        - '&7称号期限: &f{duration}'
    title-list:
      owned:
        - '&e状态: 已拥有'
        - '&7剩余时间: &f{expire}'
      not-owned:
        - '&7状态: 未拥有'
        - '&7称号期限: &f{duration}'
    look-player:
      owned:
        - '&e状态: 已拥有'
        - '&7剩余时间: &f{expire}'
      not-owned:
        - '&7状态: 未拥有'
    shop:
      owned:
        - '&e状态: 已拥有'
        - '&7剩余时间: &f{expire}'
      no-permission:
        - '&c状态: 无权限购买'
        - '&7称号期限: &f{duration}'
      buy:
        - '&a点击购买'
        - '&7称号期限: &f{duration}'
        - '&7预览命令: &f/fst preview {uid}'
      vault-price:
        - '&6金币价格: {0}'
      points-price:
        - '&b点券价格: {0}'
      free-price:
        - '&a价格: 免费'
    collection:
      owned:
        - '&a状态: 已收集'
        - '&7稀有度: {rarity_color}{rarity_name}'
        - '&7收藏进度: &f{collected}/{total} &7({progress})'
      not-owned:
        - '&7状态: 未收集'
        - '&7稀有度: {rarity_color}{rarity_name}'
        - '&7称号期限: &f{duration}'

  # 旧版称号物品追加状态，作为 gui.lore 缺失时的兼容回退
  status:
    using: '&a状态: 正在使用'
    owned: '&e状态: 已拥有'
    not-owned: '&7状态: 未拥有'
    no-permission: '&c状态: 无权限购买'
    vault-price: '&6金币价格: {0}'
    points-price: '&b点券价格: {0}'
    free-price: '&a价格: 免费'
    click-buy: '&a点击购买'
    click-equip: '&a点击佩戴'
