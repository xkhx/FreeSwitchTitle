# 称号列表 GUI

gui:
  # GUI 标题
  title:
    all-title: "全部称号"
    shop-title: "称号商城"
    my-title: "{0} 的称号列表"

  # 列表布局
  map:
    - "#########"
    - "#@@@@@@@#"
    - "L###M###N"

  # 显示称号列表的位置
  slotBy: '@'

  # 边框
  border:
    type: BLACK_STAINED_GLASS_PANE
    slot: '#'
    name: "&8⬛"

  # 个人信息
  info:
    type: PLAYER_HEAD
    slot: 'M'
    name: "&r我的信息"
    lore:
      - "&r正在使用: %fst_title_show%"
      - "&r拥有称号: %fst_title_count% 个"

  # 上一页
  previous:
    type: SPECTRAL_ARROW
    first-type: ARROW
    slot: 'L'
    name: "&f上一页"
    first-name: "&7上一页"

  # 下一页
  next:
    type: SPECTRAL_ARROW
    last-type: ARROW
    slot: 'N'
    name: "&f下一页"
    last-name: "&7下一页"

  # 称号物品追加 lore 模板
  # 可用变量: {title}, {uid}, {duration}, {expire}, {vault_price}, {points_price}
  lore:
    player-list:
      using:
        - '&a状态: 正在使用'
        - '&7剩余时间: &f{expire}'
      equip:
        - '&a点击佩戴'
        - '&7称号期限: &f{duration}'
    title-list:
      owned:
        - '&e状态: 已拥有'
        - '&7剩余时间: &f{expire}'
      not-owned:
        - '&7状态: 未拥有'
        - '&7称号期限: &f{duration}'
    look-player:
      owned:
        - '&e状态: 已拥有'
        - '&7剩余时间: &f{expire}'
      not-owned:
        - '&7状态: 未拥有'
    shop:
      owned:
        - '&e状态: 已拥有'
        - '&7剩余时间: &f{expire}'
      no-permission:
        - '&c状态: 无权限购买'
        - '&7称号期限: &f{duration}'
      buy:
        - '&a点击购买'
        - '&7称号期限: &f{duration}'
      vault-price:
        - '&6金币价格: {0}'
      points-price:
        - '&b点券价格: {0}'

  # 旧版称号物品追加状态，作为 gui.lore 缺失时的兼容回退
  status:
    using: '&a状态: 正在使用'
    owned: '&e状态: 已拥有'
    not-owned: '&7状态: 未拥有'
    no-permission: '&c状态: 无权限购买'
    vault-price: '&6金币价格: {0}'
    points-price: '&b点券价格: {0}'
    click-buy: '&a点击购买'
    click-equip: '&a点击佩戴'
